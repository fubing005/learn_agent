[project]
name = "fastapi-study-advanced"
version = "0.1.0"
description = "fastapi官方高级用户指南"
authors = [
    {name = "shalabing",email = "516051271@qq.com"},
]
dependencies = ["httpx2>=2.3.0", "psycopg[binary]>=3.3.4", "unicorn>=2.1.4", "jinja2>=3.1.6", "websockets>=16.0", "pydantic-settings>=2.14.1", "a2wsgi>=1.10.10", "flask>=3.1.3"]
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = false

[tool.fastapi]
entrypoint = "src.fastapi_study_advanced.31-strict_content_type_check:app"